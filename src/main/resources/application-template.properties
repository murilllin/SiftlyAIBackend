# ============================================================
# SIFTLYAI - APPLICATION TEMPLATE
# ============================================================
# Copiar este archivo como application.properties y completar
# las variables de entorno o valores directos
# ============================================================

spring.application.name=SiftlyAI

# ── Base de datos ────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA/Hibernate ────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Servidor ─────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ── Google OAuth2 ────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── Spring Mail ──────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Multipart ────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── API Keys ─────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY}
api.groq.key=${GROQ_API_KEY}
api.cohere.key=${COHERE_API_KEY}
api.mistral.key=${MISTRAL_API_KEY}
api.gemini.key=${GEMINI_API_KEY}
api.nvidia.nim.key=${NVIDIA_API_KEY}
api.openrouter.key=${OPENROUTER_API_KEY}

# ── Frontend URL ─────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ── Verificación ─────────────────────────────────────────────────
app.verificacion.expiracion-minutos=15

# ── Seeds (DATOS DE PRUEBA - Cambiar en producción) ──────────────
app.seed.admin.email=admin@siftly.local
app.seed.admin.password=ChangeMe123!
app.seed.admin.nombre=Admin
app.seed.admin.apellido=Siftly
app.seed.user.email=user@siftly.local
app.seed.user.password=ChangeMe123!
app.seed.user.nombre=Demo
app.seed.user.apellido=User

# ── Encriptación AES ─────────────────────────────────────────────
app.encryption.secret=${ENCRYPTION_SECRET}

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.co.edu.unbosque=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota